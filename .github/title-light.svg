<svg xmlns="http://www.w3.org/2000/svg" width="580" height="60" viewBox="0 0 580 60" role="img" aria-label="Unraid Secretary Office">
  <title>Unraid Secretary Office</title>
  <defs>
    <!-- Unraid's brand gradient, as on its login page: red #e22828 → orange #ff8c2f -->
    <linearGradient id="unraid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e22828"/>
      <stop offset="1" stop-color="#ff8c2f"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="48" font-weight="700">
    <text x="0" y="46" fill="url(#unraid)" textLength="154" lengthAdjust="spacing">Unraid</text>
    <text x="168" y="46" fill="#1f2328" textLength="406" lengthAdjust="spacing">Secretary Office</text>
  </g>
</svg>
