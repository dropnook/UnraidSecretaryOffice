<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Unraid Secretary Office">
  <title>Unraid Secretary Office</title>
  <defs>
    <!-- Unraid's brand gradient: red #e22828 to orange #ff8c2f -->
    <linearGradient id="unraid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e22828"/>
      <stop offset="1" stop-color="#ff8c2f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#unraid)"/>
  <!-- the bell at the reception -->
  <g fill="#fff">
    <rect x="214" y="150" width="84" height="26" rx="13"/>
    <rect x="243" y="166" width="26" height="40" rx="6"/>
    <path d="M110 342 A146 146 0 0 1 402 342 Z"/>
    <rect x="86" y="358" width="340" height="44" rx="22"/>
  </g>
  <path d="M166 300 A100 100 0 0 1 224 230" fill="none" stroke="#ff8c2f" stroke-width="20" stroke-linecap="round" opacity=".55"/>
</svg>
