<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Unraid Secretary Office">
  <title>Unraid Secretary Office</title>
  <defs>
    <!-- Unraid's brand gradient: red #e22828 to orange #ff8c2f -->
    <linearGradient id="unraid" gradientUnits="userSpaceOnUse" x1="40" y1="90" x2="472" y2="450">
      <stop offset="0" stop-color="#e22828"/>
      <stop offset="1" stop-color="#ff8c2f"/>
    </linearGradient>
  </defs>
  <!-- the bell at the reception, on a transparent background -->
  <g fill="url(#unraid)">
    <rect x="200" y="92" width="112" height="38" rx="19"/>
    <rect x="236" y="118" width="40" height="52" rx="8"/>
    <path d="M52 368 A204 204 0 0 1 460 368 Z"/>
    <rect x="20" y="388" width="472" height="64" rx="32"/>
  </g>
  <path d="M118 326 A150 150 0 0 1 196 220" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" opacity=".45"/>
</svg>
