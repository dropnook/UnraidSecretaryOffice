# Unraid Secretary Office
#
# Two services:
#   office  the web UI — plain php:apache, no special rights
#   agent   does the actual work on the host (zfs, btrfs, docker, Unraid's config)
#
# The agent runs privileged in the host's PID namespace and uses nsenter to
# step into the host's mount and UTS namespaces. There it runs the PHP that
# ships with Unraid — nothing gets installed on the host, and Docker starts,
# restarts and stops it together with the office (before the array stops).
#
# Settings come from .env next to this file (see .env.example).
#
# Compose Manager: create a stack, then point it here instead of copying this
# file — put the folder path into the stack's "indirect" setting.

services:
  office:
    image: php:apache
    container_name: UnraidSecretaryOffice
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
      - OFFICE_DATA_DIR=/var/www/data
    volumes:
      - ${OFFICE_DIR:-/mnt/user/appdata/UnraidSecretaryOffice}/public:/var/www/html:ro
      - ${OFFICE_DIR:-/mnt/user/appdata/UnraidSecretaryOffice}/src:/var/www/src:ro
      - ${OFFICE_DIR:-/mnt/user/appdata/UnraidSecretaryOffice}/data:/var/www/data
    # Own IP on Unraid's br0 (ipvlan/macvlan). Prefer a port on the host
    # instead? Remove "networks" here and below, and use:
    #   ports:
    #     - "8090:80"
    networks:
      br0:
        ipv4_address: ${OFFICE_IP:?set OFFICE_IP in .env}
    labels:
      net.unraid.docker.webui: "http://${OFFICE_IP}/"

  agent:
    image: php:apache            # only used for nsenter; the agent runs on Unraid's own PHP
    container_name: UnraidSecretaryOffice-Agent
    restart: unless-stopped
    privileged: true             # needed for nsenter into the host
    pid: host
    network_mode: none
    entrypoint: ["nsenter", "--target", "1", "--mount", "--uts", "--"]
    command: ["php", "${OFFICE_DIR:-/mnt/user/appdata/UnraidSecretaryOffice}/agent/agent.php", "run"]
    environment:
      - OFFICE_DATA_DIR=${OFFICE_DIR:-/mnt/user/appdata/UnraidSecretaryOffice}/data
    stop_grace_period: 20s

networks:
  br0:
    external: true
